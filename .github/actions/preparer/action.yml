name: 'Préparer l''environnement'
description: 'Installe Python et uv avec le cache activé'
inputs:
  python-version:
    description: 'Version de Python à installer'
    required: false
    default: '3.10'
runs:
  using: "composite"
  steps:
    - name: "Installer Python"
      uses: "actions/setup-python@v5"
      with:
        python-version: ${{ inputs.python-version }}

    - name: "Installer l'outil uv"
      uses: "astral-sh/setup-uv@v5"
      with:
        enable-cache: true