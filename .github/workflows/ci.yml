name: "CI"

on:
  push:
    branches:
      - main
      - feature/integration-tests
  pull_request:
    branches:
      - main
      - feature/integration-tests

permissions:
  contents: "read"

jobs:
  validate-and-test:
    name: "Validation, Linting et Tests"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Installer Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.10"

      - name: "Installer l'outil uv"
        uses: "astral-sh/setup-uv@v5"

      - name: "Vérifier le formatage du code (Format)"
        run: |
          uv run ruff format --check .

      - name: "Vérifier la qualité du code (Lint)"
        run: |
          uv run ruff check .

      - name: "Exécuter les tests unitaires et d'intégration"
        run: |
          uv run pytest tests/unit tests/integration -v --durations=0