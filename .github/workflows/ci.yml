name: "CI"

on:
  push:
    branches:
      - main
      - feature/integration-tests
  pull_request:
    branches:
      - main
      - feature/integration-tests

permissions:
  contents: "read"

jobs:
  format:
    name: "Format"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Préparer l'environnement"
        uses: ./.github/actions/preparer

      - name: "Vérifier le formatage du code"
        run: |
          uv run ruff format --check .

  lint:
    name: "Lint"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Préparer l'environnement"
        uses: ./.github/actions/preparer

      - name: "Vérifier la qualité du code"
        run: |
          uv run ruff check .

  test:
    name: "Tests"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Préparer l'environnement"
        uses: ./.github/actions/preparer

      - name: "Exécuter les tests avec couverture HTML"
        run: |
          uv run pytest tests/unit tests/integration -v --durations=0 --cov=supermarket_receipt_api --cov-report=html

      - name: "Sauvegarder les rapports de test et couverture"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            .pytest_cache/
            junit.xml
            htmlcov/
          if-no-files-found: ignore

  build:
    name: "Build"
    needs: [format, lint]
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Préparer l'environnement"
        uses: ./.github/actions/preparer

      - name: "Construire le paquet"
        run: |
          uv build

      - name: "Uploader les artefacts de build"
        uses: actions/upload-artifact@v4
        with:
          name: package-dist
          path: dist/

  read:
    name: "Read & Download Artifacts"
    needs: [test, build]
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Télécharger les rapports de test et couverture"
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: downloaded-test-results/

      - name: "Télécharger les artefacts de build"
        uses: actions/download-artifact@v4
        with:
          name: package-dist
          path: downloaded-dist/

      - name: "Vérifier la présence de index.html"
        run: |
          echo "=== Vérification du fichier index.html ==="
          ls -lh downloaded-test-results/htmlcov/index.html