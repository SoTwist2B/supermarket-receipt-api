name: "CI"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: "read"

jobs:
  ci:
    name: "CI complète"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Installer Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.10"

      - name: "Installer l'outil uv"
        uses: "astral-sh/setup-uv@v5"

      - name: "Vérifier le formatage du code (Format)"
        run: |
          uv run ruff format --check .

      - name: "Vérifier la qualité du code (Lint)"
        run: |
          uv run ruff check .

      - name: "Exécuter les tests unitaires"
        run: |
          uv run pytest tests/unit -v

  checkout:
    name: "Tests unitaires pour checkout.py"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Installer Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.10"

      - name: "Installer l'outil uv"
        uses: "astral-sh/setup-uv@v5"

      - name: "Exécuter les tests unitaires pour checkout.py"
        run: |
          uv run pytest tests/unit/test_checkout.py -v

  receipt:
    name: "Tests unitaires pour receipt.py"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Installer Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.10"

      - name: "Installer l'outil uv"
        uses: "astral-sh/setup-uv@v5"

      - name: "Exécuter les tests unitaires pour receipt.py"
        run: |
          uv run pytest tests/unit/test_receipt.py -v

  linter:
    name: "Vérification du formatage et de la qualité du code"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Installer Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.10"

      - name: "Installer l'outil uv"
        uses: "astral-sh/setup-uv@v5"

      - name: "Vérifier le formatage du code (Format)"
        run: |
          uv run ruff format --check .

      - name: "Vérifier la qualité du code (Lint)"
        run: |
          uv run ruff check .

  test:
    name: "Exécuter tous les tests"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Installer Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.10"

      - name: "Installer l'outil uv"
        uses: "astral-sh/setup-uv@v5"

      - name: "Exécuter tous les tests unitaires et d'intégration"
        run: |
          uv run pytest tests/unit tests/integration -v

  format:
    name: "Vérification du formatage du code"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Installer Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.10"

      - name: "Installer l'outil uv"
        uses: "astral-sh/setup-uv@v5"

      - name: "Vérifier le formatage du code (Format)"
        run: |
          uv run ruff format --check .

  timechecker:
    name: "Vérification du temps d'exécution des tests"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Installer Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.10"

      - name: "Installer l'outil uv"
        uses: "astral-sh/setup-uv@v5"

      - name: "Exécuter les tests unitaires et mesurer le temps d'exécution"
        run: |
          uv run pytest tests/unit --durations=0 -v