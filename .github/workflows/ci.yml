name: "CI"

on:
  push:
    branches:
      - main
      - feature/integration-tests
  pull_request:
    branches:
      - main
      - feature/integration-tests

permissions:
  contents: "read"

jobs:
  format:
    name: "Format"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Installer Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.10"

      - name: "Installer l'outil uv"
        uses: "astral-sh/setup-uv@v5"

      - name: "Vérifier le formatage du code"
        run: |
          uv run ruff format --check .

  lint:
    name: "Lint"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Installer Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.10"

      - name: "Installer l'outil uv"
        uses: "astral-sh/setup-uv@v5"

      - name: "Vérifier la qualité du code"
        run: |
          uv run ruff check .

  test:
    name: "Tests"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v4"
        with:
          persist-credentials: false

      - name: "Installer Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: "3.10"

      - name: "Installer l'outil uv"
        uses: "astral-sh/setup-uv@v5"

      - name: "Exécuter les tests"
        run: |
          uv run pytest tests/unit tests/integration -v --durations=0

      - name: "Sauvegarder les rapports de test"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            .pytest_cache/
            junit.xml
          if-no-files-found: ignore